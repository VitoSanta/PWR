[workspace]
resolver = "3"
members = [
  "crates/pwr-domain",
  "crates/pwr-provider",
  "crates/pwr-mlx",
  "crates/pwr-llama",
  "crates/pwr-compat",
  "crates/pwr-runtime",
  "crates/pwr-models",
  "crates/pwr-store",
  "crates/pwr-observe",
  "crates/pwr-tools",
  "crates/pwr-repo",
  "crates/pwr-verify",
  "crates/pwr-orchestrator",
  "crates/pwr-eval",
  "crates/pwr-cli",
]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
async-trait = "0.1.89"
blake3 = "1.8.3"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.28.1"
dialoguer = "0.11.0"
flate2 = "1.1.2"
futures-util = "0.3.31"
futures-core = "0.3.31"
proptest = "1.8.0"
hex = "0.4.3"
ignore = "0.4.23"
regex = "1.11.2"
ratatui = "0.29.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tempfile = "3.23.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "io-util", "io-std", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.18.1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
