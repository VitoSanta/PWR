@if (store.engineSetup()) {
  <pa-engine-setup [class.is-mac]="win.isMac" [class.is-fullscreen]="win.fullscreen()" />
} @else {
  @switch (variants.variant()) {
    @case ('instrument') { <pa-shell-instrument /> }
    @case ('paper') { <pa-shell-paper /> }
    @case ('islands') { <pa-shell-islands /> }
    @case ('mission') { <pa-shell-mission /> }
    @case ('focus') { <pa-shell-focus /> }
    @default { <pa-shell-studio /> }
  }
}

<pa-permission />
<pa-workspace-trust />
<pa-model-manager />
<pa-settings />
<pa-command-palette />
<pa-confirm-host />
<pa-toasts />
