<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PWR</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // The appearance before first paint, so the window never flashes the
    // other theme; ThemeService takes over once the app starts.
    (function () {
      var mode = null;
      try { mode = localStorage.getItem('pwr:theme'); } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' && (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
      var params = null;
      try { params = new URLSearchParams(location.search); } catch (e) {}
      var asked = params && params.get('palette');
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      // The colour theme for that scheme (ThemeService takes over, and checks
      // it names a palette); ?palette= wins, as there.
      var palette = asked;
      try { palette = palette || localStorage.getItem(dark ? 'pwr:palette-dark' : 'pwr:palette-light'); } catch (e) {}
      if (palette) document.documentElement.setAttribute('data-palette', palette);
      // Appearance: the accent and the headings' face (ThemeService keeps them).
      var accent = null, headings = null;
      try { accent = localStorage.getItem('pwr:accent'); headings = localStorage.getItem('pwr:headings'); } catch (e) {}
      if (accent) document.documentElement.setAttribute('data-accent', accent);
      if (headings === 'sans') document.documentElement.setAttribute('data-headings', 'sans');
      try {
        var chatSize = Number(localStorage.getItem('pwr:chat-size'));
        if ([14, 16, 18, 20].indexOf(chatSize) !== -1) document.documentElement.style.setProperty('--fs-chat', chatSize + 'px');
        if (localStorage.getItem('pwr:code-font') === 'system') document.documentElement.setAttribute('data-code-font', 'system');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
