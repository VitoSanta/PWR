<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>PWR</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fd"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="0.55" stop-color="#4c8df6"/>
      <stop offset="1" stop-color="#a8c7fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1f44" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- The macOS icon grid: an 824 tile on a 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <!-- The mark, as in kit/brand-mark.ts (32-unit grid), centred. -->
  <g transform="translate(192.4 225.3) scale(18.8)">
    <rect x="6" y="5" width="6" height="23" rx="3" fill="#1a73e8"/>
    <circle cx="17.5" cy="13" r="7.5" fill="none" stroke="url(#ring)" stroke-width="6"/>
  </g>
</svg>
