name: Draft macOS alpha release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build-and-draft:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Rust
        run: rustup show && rustc --version && cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install uv
        run: brew install uv

      - name: Build and verify release artifacts
        run: EXPECTED_VERSION="${GITHUB_REF_NAME#v}" sh scripts/release-macos.sh

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release/${GITHUB_REF_NAME}-release-notes.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PWR $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --draft \
            --prerelease \
            --verify-tag \
            dist/release/PWR-macOS-arm64.dmg \
            dist/release/SHA256SUMS.txt
