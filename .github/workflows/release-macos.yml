name: Draft macOS alpha release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build-and-draft:
    needs: checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Rust
        run: rustup show && rustc --version && cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install uv
        run: brew install uv

      - name: Build and verify release artifacts
        env:
          PWR_UPDATER_PUBLIC_KEY: ${{ vars.PWR_UPDATER_PUBLIC_KEY }}
          PWR_UPDATER_ENDPOINT: ${{ vars.PWR_UPDATER_ENDPOINT }}
          PWR_UPDATER_CHANNEL: ${{ vars.PWR_UPDATER_CHANNEL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: EXPECTED_VERSION="${GITHUB_REF_NAME#v}" sh scripts/release-macos.sh

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_ENABLED: ${{ vars.PWR_UPDATER_PUBLIC_KEY != '' }}
        run: |
          notes="docs/release/${GITHUB_REF_NAME}-release-notes.md"
          test -f "$notes"
          set -- dist/release/PWR-macOS-arm64.dmg dist/release/SHA256SUMS.txt dist/release/build-provenance.json
          if [ "$UPDATES_ENABLED" = true ]; then
            set -- "$@" dist/release/PWR.app.tar.gz dist/release/PWR.app.tar.gz.sig dist/release/latest.json
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PWR $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --draft \
            --prerelease \
            --verify-tag \
            "$@"
