name: Draft macOS alpha release

on:
  push:
    tags:
      - v0.1.0-alpha

permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Rust
        run: rustup show && rustc --version && cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install uv
        run: brew install uv

      - name: Build and verify release artifacts
        run: sh scripts/release-macos.sh

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-alpha \
            --repo VitoSanta/PWR \
            --title "PWR v0.1.0-alpha" \
            --notes-file docs/release/v0.1.0-alpha-release-notes.md \
            --draft \
            --prerelease \
            --verify-tag \
            dist/release/PWR-macOS-arm64.dmg \
            dist/release/SHA256SUMS.txt
