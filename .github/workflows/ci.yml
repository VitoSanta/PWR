name: CI

# No inference engine or live model runs here. Those checks remain recorded
# separately with their deployment provenance. CI gates Rust and desktop code.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  desktop:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Desktop unit tests
        run: npm test -- --watch=false
      - name: Desktop build
        run: npm run build

  mlx-sidecar:
    # GitHub's macos-15 label is Apple silicon; MLX has no Intel runtime.
    runs-on: macos-15
    env:
      HF_HUB_OFFLINE: '1'
      PYTHONPATH: crates/pwr-mlx/sidecar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned engine libraries
        run: python -m pip install 'mlx==0.32.0' 'mlx-lm==0.31.3'
      - name: Sidecar unit tests
        run: python -m unittest crates/pwr-mlx/sidecar/test_pwr_mlx.py

  check:
    # macOS because the sandbox adapter is seatbelt, and its fixtures are the
    # ones most worth running: on Linux they would be skipped, which is the
    # shape of a suite that passes because it tested nothing.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup show && rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # The two network tests are #[ignore]d and stay that way: a CI run that
        # reaches the internet is a CI run that fails for reasons unrelated to
        # the change.
        #
        # Every test runs (--no-fail-fast), and a failing one is also reported
        # as an annotation naming the test and its panic: job logs need a
        # signed-in account to read, annotations do not, so anyone can see
        # what broke. The exit status is still cargo's own.
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log
      - name: Name the failing tests
        if: failure()
        run: |
          grep -E '^test .* FAILED$' test-output.log | sed 's/^/::error title=failing test::/' || true
          grep -E "panicked at" -A2 test-output.log | head -40 | tr '\n' ' ' | sed 's/^/::error title=panic::/' || true
          echo

      - name: Milestone table matches its manifest
        # The roadmap's status table is generated. If someone edits it by hand
        # it stops matching, and the two disagree again -- which is the thing
        # the manifest exists to prevent.
        run: |
          python3 scripts/milestones.py
          git diff --exit-code docs/roadmap.md
